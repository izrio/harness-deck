# 发布：分别打包 VS Code 插件（vsix）、JetBrains / IDEA 插件（zip）与 Electron 桌面端安装包（exe / dmg / AppImage），创建 GitHub Release 并附上安装包。
# - 推送 v* 标签时自动运行（例如 git tag v0.5.0 && git push origin v0.5.0）；
# - 也可以在 Actions 页面手动运行，填写标签（标签不存在时在当前提交上创建）。
# 标签必须与 packages/extension/package.json 及 packages/jetbrains/build.gradle.kts 的版本一致；发布说明取 CHANGELOG.md 里对应版本的一节。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，例如 v0.5.0（必须与插件版本一致）'
        required: true
      prerelease:
        description: '标记为预发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  vscode:
    name: Build VS Code plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches VS Code package version
        id: version
        run: |
          VERSION="$(node -p "require('./packages/extension/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::标签 $TAG 与 packages/extension/package.json 的版本 $VERSION 不一致"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package

      - name: Prepare VS Code asset
        run: |
          VSIX="packages/extension/Halo-${VERSION}-vscode.vsix"
          test -f "$VSIX"
          mkdir -p release-vscode
          cp "$VSIX" release-vscode/
          (cd release-vscode && sha256sum "Halo-${VERSION}-vscode.vsix" > "Halo-${VERSION}-vscode.vsix.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-vscode
          path: release-vscode/*

  jetbrains:
    name: Build IDEA plugin
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches JetBrains plugin version
        id: version
        run: |
          JB_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' packages/jetbrains/build.gradle.kts | head -n 1)"
          if [ "$TAG" != "v$JB_VERSION" ]; then
            echo "::error::标签 $TAG 与 packages/jetbrains/build.gradle.kts 的版本 $JB_VERSION 不一致"
            exit 1
          fi
          echo "version=$JB_VERSION" >> "$GITHUB_OUTPUT"
          echo "JB_VERSION=$JB_VERSION" >> "$GITHUB_ENV"

      - run: pnpm build

      - name: Test and build JetBrains plugin
        working-directory: packages/jetbrains
        run: gradle test buildPlugin

      - name: Prepare JetBrains asset
        run: |
          ZIP="packages/jetbrains/build/distributions/Halo-${JB_VERSION}-jetbrains.zip"
          test -f "$ZIP"
          mkdir -p release-jetbrains
          cp "$ZIP" release-jetbrains/
          (cd release-jetbrains && sha256sum "Halo-${JB_VERSION}-jetbrains.zip" > "Halo-${JB_VERSION}-jetbrains.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: release-jetbrains
          path: release-jetbrains/*

  desktop:
    name: Build desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: release-desktop-linux
            paths: |
              packages/desktop/release/*.AppImage
          - os: macos-latest
            artifact: release-desktop-macos
            paths: |
              packages/desktop/release/*.dmg
              packages/desktop/release/Halo-*.zip
          - os: windows-latest
            artifact: release-desktop-windows
            paths: |
              packages/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check tag matches desktop package version
        shell: bash
        run: |
          VERSION="$(node -p "require('./packages/desktop/package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::标签 $TAG 与 packages/desktop/package.json 的版本 $VERSION 不一致"
            exit 1
          fi

      # 桌面端把 sidecar 与 Webview 静态资源作为 extraResources 打进安装包，先构建它们。
      - run: pnpm build

      - name: Package desktop app
        working-directory: packages/desktop
        env:
          # 未配置签名证书：跳过 macOS 代码签名自动发现，产出未签名安装包。
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run package

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}

  release:
    name: Publish GitHub Release
    needs: [vscode, jetbrains, desktop]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.vscode.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-vscode
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-jetbrains
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-desktop-linux
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-desktop-macos
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-desktop-windows
          path: release

      - name: Checksums for desktop assets
        run: |
          shopt -s nullglob
          cd release
          for file in *.exe *.dmg *.AppImage Halo-*.zip; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Prepare release notes
        run: |
          # CHANGELOG 里 "## <版本>" 到下一个 "## " 之间的内容（先中文后英文）
          awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found {print}' packages/extension/CHANGELOG.md > release/changes.md
          {
            echo "## 更新内容 / Changes"
            cat release/changes.md
          } > release/notes.md
          cat release/notes.md

      - name: Create or update release
        run: |
          shopt -s nullglob
          FLAGS=()
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then FLAGS+=(--prerelease); fi
          ASSETS=(release/*.vsix release/*.zip release/*.exe release/*.dmg release/*.AppImage release/*.sha256)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重新运行时更新已有的 Release，替换安装包
            gh release edit "$TAG" --title "Halo ${TAG}" --notes-file release/notes.md "${FLAGS[@]}"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Halo ${TAG}" \
              --notes-file release/notes.md \
              --target "$GITHUB_SHA" \
              "${FLAGS[@]}"
          fi
